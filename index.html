<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asma's Online Service - Professional RTO Portal</title>
    <style>
        :root {
            --bg-color: #0d0f14;
            --card-bg: #161920;
            --input-bg: #1f232d;
            --accent: #00d4ff;
            --accent-hover: #00b9de;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --border-color: #2d323f;
            --danger: #ff4d4d;
            --warning: #ffb703;
            --success: #2ec4b6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }
        
        /* Login Screen */
        .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: #07080c; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); text-align: center; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-card h2 { color: var(--accent); margin-bottom: 25px; font-size: 24px; }

        /* Main App Layout */
        .main-app { display: none; max-width: 1300px; margin: auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header h1 { color: var(--accent); font-size: 26px; }
        .header p { color: var(--text-muted); font-size: 14px; margin-top: 5px; }

        /* Utility Buttons */
        .btn-group { display: flex; gap: 10px; }
        button { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s ease; font-size: 14px; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-secondary { background: #31374a; color: #fff; }

        /* Form Styling */
        .form-container { background: var(--card-bg); padding: 25px; border-radius: 14px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        .form-title { font-size: 18px; color: var(--accent); margin-bottom: 20px; font-weight: 600; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        input[type="text"], input[type="date"], input[type="password"] { background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; color: #fff; font-size: 14px; width: 100%; }
        input:focus { border-color: var(--accent); outline: none; }
        
        /* File Input Wrapper */
        .file-wrapper { background: #252a37; border: 1px dashed var(--border-color); padding: 8px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; }
        .file-wrapper input[type="file"] { color: var(--text-muted); font-size: 12px; width: 75%; }

        /* Table Styling */
        .table-section { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1e222d; color: var(--accent); padding: 16px; font-size: 14px; font-weight: 600; border-bottom: 2px solid var(--border-color); }
        td { padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 14px; vertical-align: middle; }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* Status & Badges */
        .date-badge { display: inline-block; padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; }
        .expired { background: rgba(255, 77, 77, 0.15); color: var(--danger); border: 1px solid var(--danger); animation: pulse 1.5s infinite; }
        .upcoming { background: rgba(255, 183, 3, 0.15); color: var(--warning); border: 1px solid var(--warning); }
        .normal { color: #fff; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* Document Links */
        .doc-link-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .doc-chip { display: inline-flex; align-items: center; background: #252a37; color: var(--accent); padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 12px; border: 1px solid #3a4154; font-weight: 500; }
        .doc-chip:hover { background: var(--accent); color: #000; }
        .doc-missing { color: #4a5568; font-size: 12px; font-style: italic; }

        /* Action Buttons in Table */
        .action-cell { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 4px; }
        .btn-edit { background: #ffb703; color: #000; }
        .btn-delete { background: #ff4d4d; color: #fff; }

        /* Notification Panel */
        .alert-panel { background: rgba(255, 77, 77, 0.1); border-left: 4px solid var(--danger); padding: 15px; border-radius: 8px; margin-bottom: 25px; display: none; }
        .alert-panel h4 { color: var(--danger); margin-bottom: 5px; }
        .alert-panel ul { list-style-position: inside; color: #f7fafc; font-size: 14px; }
    </style>
</head>
<body>

<div id="loginSection" class="login-screen">
    <div class="login-card">
        <h2>Asma's Online Service</h2>
        <div class="input-box" style="margin-bottom: 20px;">
            <input type="password" id="passInput" placeholder="Password നൽകുക" onkeypress="if(event.key === 'Enter') checkLogin()">
        </div>
        <button class="btn-primary" style="width:100%" onclick="checkLogin()">Login</button>
    </div>
</div>

<div id="appSection" class="main-app">
    <div class="header">
        <div>
            <h1>Asma's Online Service Portal</h1>
            <p>RTO Documents & Expiry Track System</p>
        </div>
        <div class="btn-group">
            <button class="btn-success" onclick="downloadBackup()">Backup Download</button>
            <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">Restore Backup</button>
            <input type="file" id="fileInput" style="display:none" onchange="restoreBackup(event)" accept=".json">
        </div>
    </div>

    <div id="alertPanel" class="alert-panel">
        <h4>⚠️ അടിയന്തിര ശ്രദ്ധയ്ക്ക് (Expiry Alerts)</h4>
        <ul id="alertList"></ul>
    </div>

    <div class="form-container">
        <div class="form-title" id="formTitle">പുതിയ കസ്റ്റമർ വിവരങ്ങൾ ചേർക്കുക</div>
        <input type="hidden" id="editId">
        <div class="grid-inputs">
            <div class="input-box">
                <label>Customer Name</label>
                <input type="text" id="custName" placeholder="ഉടമയുടെ പേര്">
            </div>
            <div class="input-box">
                <label>Vehicle Number</label>
                <input type="text" id="vehNo" placeholder="KL-10-AA-1234">
            </div>
            <div class="input-box">
                <label>Insurance Expiry</label>
                <input type="date" id="insDate">
                <div class="file-wrapper"><input type="file" id="insFile"></div>
            </div>
            <div class="input-box">
                <label>Tax Expiry</label>
                <input type="date" id="taxDate">
                <div class="file-wrapper"><input type="file" id="taxFile"></div>
            </div>
            <div class="input-box">
                <label>Permit Expiry</label>
                <input type="date" id="perDate">
                <div class="file-wrapper"><input type="file" id="perFile"></div>
            </div>
            <div class="input-box">
                <label>Fitness Expiry</label>
                <input type="date" id="fitDate">
                <div class="file-wrapper"><input type="file" id="fitFile"></div>
            </div>
            <div class="input-box">
                <label>PUC (Pollution) Expiry</label>
                <input type="date" id="pucDate">
                <div class="file-wrapper"><input type="file" id="pucFile"></div>
            </div>
            <div class="input-box">
                <label>Renewal Date</label>
                <input type="date" id="renDate">
                <div class="file-wrapper"><input type="file" id="renFile"></div>
            </div>
        </div>
        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button class="btn-primary" id="saveBtn" onclick="saveData()">Save Customer</button>
            <button class="btn-secondary" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancel Edit</button>
        </div>
    </div>

    <div class="table-section">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Customer Details</th>
                        <th>Insurance</th>
                        <th>Tax</th>
                        <th>Permit</th>
                        <th>Fitness</th>
                        <th>PUC</th>
                        <th>Renewal</th>
                        <th>Documents</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let database = JSON.parse(localStorage.getItem('asma_advanced_rto_db')) || [];

    function checkLogin() {
        if(document.getElementById('passInput').value !== "") {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            renderTable();
        } else {
            alert("ദയവായി ഒരു Password നൽകുക!");
        }
    }

    const toBase64 = file => new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
    });

    async function saveData() {
        const name = document.getElementById('custName').value.trim();
        const veh = document.getElementById('vehNo').value.trim();
        if(!name || !veh) return alert("ഉടമയുടെ പേരും വണ്ടി നമ്പറും നിർബന്ധമാണ്!");

        const editId = document.getElementById('editId').value;
        let existingRecord = editId ? database.find(c => c.id == editId) : null;

        const getFileData = async (inputId, key) => {
            const fileInput = document.getElementById(inputId);
            if(fileInput.files.length > 0) {
                return await toBase64(fileInput.files[0]);
            }
            return existingRecord ? existingRecord[key] : null;
        };

        const insDoc = await getFileData('insFile', 'insDoc');
        const taxDoc = await getFileData('taxFile', 'taxDoc');
        const perDoc = await getFileData('perFile', 'perDoc');
        const fitDoc = await getFileData('fitFile', 'fitDoc');
        const pucDoc = await getFileData('pucFile', 'pucDoc');
        const renDoc = await getFileData('renFile', 'renDoc');

        const customerData = {
            id: editId ? Number(editId) : Date.now(),
            name: name,
            veh: veh,
            insDate: document.getElementById('insDate').value,
            taxDate: document.getElementById('taxDate').value,
            perDate: document.getElementById('perDate').value,
            fitDate: document.getElementById('fitDate').value,
            pucDate: document.getElementById('pucDate').value,
            renDate: document.getElementById('renDate').value,
            insDoc: insDoc,
            taxDoc: taxDoc,
            perDoc: perDoc,
            fitDoc: fitDoc,
            pucDoc: pucDoc,
            renDoc: renDoc
        };

        if(editId) {
            database = database.map(c => c.id == editId ? customerData : c);
            alert("വിവരങ്ങൾ വിജയകരമായി Edit ചെയ്ത് പുതുക്കി!");
        } else {
            database.push(customerData);
            alert("പുതിയ വിവരങ്ങൾ സുരക്ഷിതമായി Save ചെയ്തു!");
        }

        localStorage.setItem('asma_advanced_rto_db', JSON.stringify(database));
        resetForm();
        renderTable();
    }

    function editCustomer(id) {
        const c = database.find(item => item.id === id);
        if(!c) return;

        document.getElementById('editId').value = c.id;
        document.getElementById('custName').value = c.name;
        document.getElementById('vehNo').value = c.veh;
        document.getElementById('insDate').value = c.insDate;
        document.getElementById('taxDate').value = c.taxDate;
        document.getElementById('perDate').value = c.perDate;
        document.getElementById('fitDate').value = c.fitDate;
        document.getElementById('pucDate').value = c.pucDate;
        document.getElementById('renDate').value = c.renDate;

        document.getElementById('formTitle').innerText = "കസ്റ്റമർ വിവരങ്ങൾ Edit ചെയ്യുക: " + c.name;
        document.getElementById('saveBtn').innerText = "Update Data";
        document.getElementById('cancelBtn').style.display = "inline-block";
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('editId').value = "";
        document.getElementById('custName').value = "";
        document.getElementById('vehNo').value = "";
        document.getElementById('insDate').value = "";
        document.getElementById('taxDate').value = "";
        document.getElementById('perDate').value = "";
        document.getElementById('fitDate').value = "";
        document.getElementById('pucDate').value = "";
        document.getElementById('renDate').value = "";
        
        document.getElementById('insFile').value = "";
        document.getElementById('taxFile').value = "";
        document.getElementById('perFile').value = "";
        document.getElementById('fitFile').value = "";
        document.getElementById('pucFile').value = "";
        document.getElementById('renFile').value = "";

        document.getElementById('formTitle').innerText = "പുതിയ കസ്റ്റമർ വിവരങ്ങൾ ചേർക്കുക";
        document.getElementById('saveBtn').innerText = "Save Customer";
        document.getElementById('cancelBtn').style.display = "none";
    }

    function getDateStatus(dateStr) {
        if(!dateStr) return { class: 'normal', label: 'തീയതി നൽകിയിട്ടില്ല' };
        const today = new Date();
        today.setHours(0,0,0,0);
        const expDate = new Date(dateStr);
        expDate.setHours(0,0,0,0);
        
        const diffTime = expDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if(diffDays <= 0) {
            return { class: 'expired', label: `${dateStr} (കഴിഞ്ഞു)` };
        } else if(diffDays <= 2) {
            return { class: 'upcoming', label: `${dateStr} (${diffDays} ദിവസം ബാക്കി)` };
        }
        return { class: 'normal', label: dateStr };
    }

    function renderTable() {
        const tbody = document.getElementById('dataTable');
        const alertList = document.getElementById('alertList');
        const alertPanel = document.getElementById('alertPanel');
        
        tbody.innerHTML = "";
        alertList.innerHTML = "";
        let alertCount = 0;

        database.forEach(c => {
            const ins = getDateStatus(c.insDate);
            const tax = getDateStatus(c.taxDate);
            const per = getDateStatus(c.perDate);
            const fit = getDateStatus(c.fitDate);
            const puc = getDateStatus(c.pucDate);
            const ren = getDateStatus(c.renDate);

            if(ins.class === 'expired' || ins.class === 'upcoming') { alertList.innerHTML += `<li>${c.name} (${c.veh}) - Insurance കാലാവധി ശ്രദ്ധിക്കുക!</li>`; alertCount++; }
            if(tax.class === 'expired' || tax.class === 'upcoming') { alertList.innerHTML += `<li>${c.name} (${c.veh}) - Road Tax കാലാവധി ശ്രദ്ധിക്കുക!</li>`; alertCount++; }
            if(per.class === 'expired' || per.class === 'upcoming') { alertList.innerHTML += `<li>${c.name} (${c.veh}) - Permit കാലാവധി ശ്രദ്ധിക്കുക!</li>`; alertCount++; }
            if(fit.class === 'expired' || fit.class === 'upcoming') { alertList.innerHTML += `<li>${c.name} (${c.veh}) - Fitness കാലാവധി ശ്രദ്ധിക്കുക!</li>`; alertCount++; }
            if(puc.class === 'expired' || puc.class === 'upcoming') { alertList.innerHTML += `<li>${c.name} (${c.veh}) - PUC Pollution കാലാവധി ശ്രദ്ധിക്കുക!</li>`; alertCount++; }
            if(ren.class === 'expired' || ren.class === 'upcoming') { alertList.innerHTML += `<li>${c.name} (${c.veh}) - Renewal കാലാവധി ശ്രദ്ധിക്കുക!</li>`; alertCount++; }

            let docHtml = `<div class="doc-link-group">`;
            if(c.insDoc) docHtml += `<a href="${c.insDoc}" download="Insurance_${c.veh}.png" class="doc-chip" target="_blank">Ins 📄</a>`;
            if(c.taxDoc) docHtml += `<a href="${c.taxDoc}" download="Tax_${c.veh}.png" class="doc-chip" target="_blank">Tax 📄</a>`;
            if(c.perDoc) docHtml += `<a href="${c.perDoc}" download="Permit_${c.veh}.png" class="doc-chip" target="_blank">Permit 📄</a>`;
            if(c.fitDoc) docHtml += `<a href="${c.fitDoc}" download="Fitness_${c.veh}.png" class="doc-chip" target="_blank">Fit 📄</a>`;
            if(c.pucDoc) docHtml += `<a href="${c.pucDoc}" download="PUC_${c.veh}.png" class="doc-chip" target="_blank">PUC 📄</a>`;
            if(c.renDoc) docHtml += `<a href="${c.renDoc}" download="Renewal_${c.veh}.png" class="doc-chip" target="_blank">Ren 📄</a>`;
            
            if(docHtml === `<div class="doc-link-group">`) docHtml = `<span class="doc-missing">ഫയലുകൾ ഇല്ല</span>`;
            else docHtml += `</div>`;

            tbody.innerHTML += `
                <tr>
                    <td><strong>${c.name}</strong><br><span style="color:var(--accent); font-weight:bold;">${c.veh}</span></td>
                    <td><span class="date-badge ${ins.class}">${ins.label}</span></td>
                    <td><span class="date-badge ${tax.class}">${tax.label}</span></td>
                    <td><span class="date-badge ${per.class}">${per.label}</span></td>
                    <td><span class="date-badge ${fit.class}">${fit.label}</span></td>
                    <td><span class="date-badge ${puc.class}">${puc.label}</span></td>
                    <td><span class="date-badge ${ren.class}">${ren.label}</span></td>
                    <td>${docHtml}</td>
                    <td>
                        <div class="action-cell">
                            <button class="btn-sm btn-edit" onclick="editCustomer(${c.id})">Edit</button>
                            <button class="btn-sm btn-delete" onclick="deleteCustomer(${c.id})">Del</button>
                        </div>
                    </td>
                </tr>
            `;
        });

        alertPanel.style.display = alertCount > 0 ? "block" : "none";
    }

    function deleteCustomer(id) {
        if(confirm("ഈ കസ്റ്റമറുടെ എല്ലാ വിവരങ്ങളും ഡിലീറ്റ് ചെയ്യണോ?")) {
            database = database.filter(item => item.id !== id);
            localStorage.setItem('asma_advanced_rto_db', JSON.stringify(database));
            renderTable();
        }
    }

    function downloadBackup() {
        if(database.length === 0) return alert("ഡൗൺലോഡ് ചെയ്യാൻ ഡാറ്റയൊന്നും നിലവിലില്ല!");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(database));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "Asma_RTO_Data_Backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function restoreBackup(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if(Array.isArray(importedData)) {
                    database = importedData;
                    localStorage.setItem('asma_advanced_rto_db', JSON.stringify(database));
                    renderTable();
                    alert("ബാക്കപ്പ് ഫയൽ വിജയകരമായി Restore ചെയ്തു!");
                } else {
                    alert("ഫയൽ ശരിയായ ഫോർമാറ്റിൽ അല്ല!");
                }
            } catch(err) {
                alert("ബാക്കപ്പ് ഫയൽ റീഡ് ചെയ്യാൻ സാധിച്ചില്ല!");
            }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
